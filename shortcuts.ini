; XFileUnpacker desktop shortcuts. Put this file beside XFileUnpacker.exe.
; Missing entries use defaults; an empty value disables that shortcut.
[shortcuts]
open=Ctrl+O
extract=Ctrl+E
extract_selected=Ctrl+Shift+E
test=Ctrl+T
copy_path=Ctrl+Shift+C
information=Alt+Enter
log=Ctrl+L
cancel=Escape
quit=Ctrl+Q
root=Ctrl+Home
refresh=F5
about=F1
options=Ctrl+Comma
