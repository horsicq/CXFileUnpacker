name: Build and publish Beta

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out XFileUnpacker
        uses: actions/checkout@v7
        with:
          path: CXFileUnpacker
          submodules: recursive
      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config
      - name: Configure
        working-directory: CXFileUnpacker
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        working-directory: CXFileUnpacker
        run: cmake --build build --parallel 2
      - name: Package Ubuntu
        working-directory: CXFileUnpacker
        run: |
          version=$(head -n 1 release_version.txt)
          cpack --config build/CPackConfig.cmake -G ZIP -B release -D "CPACK_PACKAGE_FILE_NAME=xfileunpacker_ubuntu24_amd64_${version}"
      - name: Save Ubuntu package
        uses: actions/upload-artifact@v7
        with:
          name: xfileunpacker-ubuntu24
          path: CXFileUnpacker/release/xfileunpacker_ubuntu24_amd64_*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - name: Check out XFileUnpacker
        uses: actions/checkout@v7
        with:
          path: CXFileUnpacker
          submodules: recursive
      - name: Build and package Windows
        shell: cmd
        working-directory: CXFileUnpacker
        run: call packaging\Windows\build_portable_windows.cmd x64 win64
      - name: Save Windows package
        uses: actions/upload-artifact@v7
        with:
          name: xfileunpacker-win64
          path: CXFileUnpacker/release/xfileunpacker_win64_portable_*.zip
          if-no-files-found: error

  publish-beta:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ubuntu, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: xfileunpacker-beta-publish
      cancel-in-progress: false
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: xfileunpacker-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages
        shell: bash
        run: |
          shopt -s nullglob
          ubuntu=(release-assets/xfileunpacker_ubuntu24_amd64_*.zip)
          windows=(release-assets/xfileunpacker_win64_portable_*.zip)
          if (( ${#ubuntu[@]} != 1 || ${#windows[@]} != 1 )); then
            echo "::error::Expected one Ubuntu ZIP and one Windows ZIP."
            exit 1
          fi
      - name: Point Beta tag at packaged commit
        id: beta-tag
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const master = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
            if (master.data.object.sha !== context.sha) {
              core.notice('Skipping Beta: master moved while these packages were building.');
              core.setOutput('publish', 'false');
              return;
            }
            await github.rest.git.updateRef({ owner, repo, ref: 'tags/Beta', sha: context.sha, force: true });
            core.setOutput('publish', 'true');
      - name: Upload to Beta release
        if: steps.beta-tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Beta
          name: Beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*.zip
